name: "💰 수익창출 준비 리포트"

# 매주 월요일 아침 자동 실행(읽기 전용·무료). 결과는 실행 요약(Summary)에 표로 남는다.
# 조건 진행(구독자·공개 롱폼 시청시간), 형식별 성과, 최근 롱폼 20편 심사 대비 점검, 신청 가능 여부.
# 영상은 하나도 건드리지 않는다.
on:
  schedule:
    - cron: "41 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 리포트
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: npx tsx scripts/yppReport.mts
      - name: 리포트를 저장소에 저장(data/reports/ypp-latest.md)
        run: |
          git config user.name "mystery-cut-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports/ypp-latest.md
          git diff --cached --quiet && exit 0
          git commit -qm "chore: 주간 수익창출 리포트 [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin HEAD:"${{ github.ref_name }}" && exit 0; sleep $((i*5)); done
          echo "⚠️ 리포트 저장 푸시 실패(리포트 자체는 위 로그·요약에 있음)"
