name: "💬 한국어 자막 트랙 삭제"

# 사용법: Actions 탭 → "💬 한국어 자막 트랙 삭제" → Run workflow.
# 화면 자막과 겹쳐 두 번 보이는 '한국어' 업로드 자막 트랙을 미스터리 컷 영상(2026-01-01 이후)에서 지웁니다.
# 옛 '새미했다' 영상은 건드리지 않습니다. 기본은 미리보기 — apply 를 true 로 해야 실제 삭제.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 삭제 (false 면 미리보기만)"
        type: boolean
        required: false
        default: false
      skip:
        description: "앞에서 건너뛸 영상 수 (최신순, 처음엔 0)"
        required: false
        default: "0"

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 한국어 자막 트랙 확인/삭제
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: npx tsx scripts/removeKoCaptions.mts ${{ github.event.inputs.apply == 'true' && '--apply' || '' }} --max 40 --skip ${{ github.event.inputs.skip || '0' }}
