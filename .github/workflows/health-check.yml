name: "🩺 자동화 건강 점검"

# 사람이 기억하고 챙겨야 하는 일을 대신 감시합니다.
#  ① GH_PAT 만료 — 만료되면 인스타 토큰 갱신이 조용히 실패하고
#     약 60일 뒤 인스타 게시가 통째로 멈춘다. 원인 찾기가 매우 어려운 고장.
#  ② 게시 중단 — 오래 멈추면 커밋도 끊기고, 저장소 60일 무활동으로
#     GitHub 이 예약 워크플로를 영구히 꺼버린다.
# 문제가 있으면 이 워크플로가 '실패'하고, GitHub 이 실패 알림 메일을 보냅니다.
on:
  schedule:
    - cron: "0 22 * * 0" # 매주 일요일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ── ① GH_PAT 유효성·만료일 ─────────────────────────────────
      # GitHub 은 만료일이 설정된 토큰에 대해 응답 헤더로 만료 시각을 알려준다.
      # (github-authentication-token-expiration). 헤더가 없으면 만료 없는 토큰.
      - name: GH_PAT 확인
        id: pat
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -o pipefail
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT 시크릿이 비어 있습니다. 인스타 토큰 자동 갱신이 동작하지 않습니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEADERS="$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user || true)"

          STATUS="$(printf '%s' "$HEADERS" | head -1 | tr -d '\r')"
          echo "응답: $STATUS"

          if ! printf '%s' "$STATUS" | grep -q " 200"; then
            echo "::error::GH_PAT 이 유효하지 않습니다($STATUS). 만료됐거나 취소된 토큰입니다."
            echo "  → GitHub Settings → Developer settings → Personal access tokens 에서"
            echo "     새로 발급(권한: 이 저장소의 Secrets write)한 뒤 GH_PAT 시크릿을 교체하세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXP="$(printf '%s' "$HEADERS" \
            | grep -i '^github-authentication-token-expiration:' \
            | cut -d' ' -f2- | tr -d '\r' || true)"

          if [ -z "$EXP" ]; then
            echo "✅ GH_PAT 유효 — 만료일 없음"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "2026-12-31 07:00:00 UTC" 형태 → 남은 일수 계산
          EXP_TS="$(date -u -d "$(echo "$EXP" | sed 's/ UTC$//')" +%s 2>/dev/null || echo 0)"
          if [ "$EXP_TS" -eq 0 ]; then
            echo "⚠️ 만료일을 해석하지 못했습니다: $EXP (점검은 통과 처리)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAYS=$(( (EXP_TS - $(date -u +%s)) / 86400 ))
          echo "GH_PAT 만료까지 ${DAYS}일 남음 ($EXP)"

          # 인스타 토큰이 60일짜리라, PAT 이 그 전에 만료되면 갱신이 끊긴다.
          # 여유를 두고 21일 전부터 경고한다.
          if [ "$DAYS" -le 21 ]; then
            echo "::error::GH_PAT 이 ${DAYS}일 뒤 만료됩니다($EXP). 지금 교체하세요."
            echo "  → 방치하면 인스타 토큰 갱신이 멈추고, 약 60일 뒤 인스타 게시가 중단됩니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ GH_PAT 여유 있음 (${DAYS}일)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # ── ② 게시가 끊기지 않았는지 ────────────────────────────────
      - name: 최근 게시 확인
        id: posts
        run: |
          LAST="$(python3 -c "
          import json
          p=json.load(open('data/history.json'))['posts']
          print(p[-1]['at'] if p else '')
          ")"
          if [ -z "$LAST" ]; then
            echo "::error::게시 이력이 비어 있습니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "마지막 게시: $LAST (${DAYS}일 전)"
          # 하루 3회 게시가 정상이므로 2일 넘게 조용하면 무언가 고장난 것이다.
          if [ "$DAYS" -ge 2 ]; then
            echo "::error::${DAYS}일째 게시가 없습니다. Actions 탭에서 '미스터리 릴스 자동 게시' 실패 로그를 확인하세요."
            echo "  → 이 상태로 60일이 지나면 저장소 무활동으로 예약 실행이 영구히 꺼집니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ 게시 정상"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 하트비트 ────────────────────────────────────────────────
      # 게시가 멈춰 커밋이 끊기더라도 저장소 활동을 남겨, GitHub 의
      # '60일 무활동 → 예약 워크플로 자동 정지' 를 구조적으로 차단한다.
      - name: 하트비트 기록
        run: |
          mkdir -p data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/heartbeat.txt
          if [[ -n "$(git status --porcelain data/heartbeat.txt)" ]]; then
            git config user.name "mystery-cut-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/heartbeat.txt
            git commit -m "chore: 건강 점검 하트비트 [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
            echo "하트비트 커밋 완료 (저장소 활동 유지)"
          fi

      # ── 판정 ────────────────────────────────────────────────────
      # 하나라도 문제면 실패시켜 GitHub 이 알림 메일을 보내게 한다.
      - name: 결과 판정
        run: |
          echo "GH_PAT: ${{ steps.pat.outputs.ok }} / 게시: ${{ steps.posts.outputs.ok }}"
          if [ "${{ steps.pat.outputs.ok }}" != "true" ] || [ "${{ steps.posts.outputs.ok }}" != "true" ]; then
            echo "위 error 항목을 확인하세요. 조치 방법은 OPERATIONS.md 4·5장에 있습니다."
            exit 1
          fi
          echo "🩺 전부 정상입니다."
