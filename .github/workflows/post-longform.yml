name: 미스터리 롱폼 자동 게시

# 주 3회(월·수·금 저녁) 가로형 사건 분석 다큐(몰아보기 — 여러 사건 모음,
# 2026-09-13 전환)를 만들어 유튜브에 올립니다. 사건 1건이 아니라 5건을
# 순서대로 만들어 이어붙이며, 사건마다 원문(위키백과 등) 분량에 비례해
# 대본 길이가 정해집니다(longform.ts 의 CASE_CHAR_LIMITS 참고). 나레이션
# 속도는 고정이라, 늘어나는 시간은 전부 실제 원문에 있는 사실을 더 쓴
# 결과입니다. 실측(2026-09-13 드라이런): 5건 합계 약 24분.
#
# 왜 롱폼인가: 쇼츠 조회수는 YPP 시청 시간 4,000시간에 산입되지 않는다.
# 구독자 1,000명 조건은 이미 충족했으므로, 남은 것은 시청 시간뿐이고
# 그건 롱폼으로만 쌓인다. (쇼츠 경로인 90일 1,000만 조회는 현재 속도로
# 약 41배 부족해서 현실적인 계획이 아니다.)
#
# 매일 올리지 않는 이유: 유튜브는 '템플릿으로 대량생성돼 서로 대체 가능한
# 콘텐츠'를 수익창출 부적합 사례로 든다. 심사자가 보는 최신 영상 목록이
# 매일 같은 틀의 롱폼으로 채워지면 그 자체가 위험 신호가 된다.
# (2026-08-26: 주 2회에서 주 3회로 상향. 소재 발굴을 실제 위키백과 검색으로
# 그라운딩하고(discoverCandidateTitles) 위키뉴스·위키문헌까지 원문 후보를
# 넓혀서, 늘어난 빈도만큼 소재가 마르지 않게 했다 — sources.ts 참고.
# 그래도 주 4회 이상은 아직 시도하지 않는다.)
on:
  schedule:
    # UTC 기준. KST = UTC+9.
    # 11/3 사장님 결정: 주 2편(수·토), 게시 시각은 매번 17~23시 KST 사이 무작위. 11:37 KST 에 깨워 아래 '게시 시각 맞추기'에서 기다린다.
    - cron: "37 2 * * 3,6"
  workflow_dispatch:
    inputs:
      seed:
        description: "사건 소재 힌트(선택)"
        required: false
        default: ""
      dry_run:
        description: "게시 없이 영상만 생성(검증용)"
        type: boolean
        required: false
        default: false
      # 11/8: 수요일 단일 사건(쇼츠 성과 상위 사건 심층) / 토요일 테마 몰아보기. auto = 수요일 KST 는 data/longformConfig.json 의 wedMode, 그 외 몰아보기
      mode:
        description: "형식(auto=요일 기준 / single=단일 사건 / compilation=테마 몰아보기)"
        type: choice
        required: false
        default: auto
        options:
          - auto
          - single
          - compilation
      seed_video_id:
        description: "단일 사건 시드로 쓸 쇼츠 videoId(선택)"
        required: false
        default: ""

# ★게시 그룹은 post-reel.yml 과 글자 그대로 같은 'mystery-cut-publish' — 두 워크플로가 겹치는
# 날 서로 다른 소재를 동시에 골라 같은 사건이 두 번 게시되는 레이스를 막는다
# (11/8: 예전엔 접두사가 달라 실제로는 공유되지 않았다. 사고 시나리오는 post-reel.yml 의 같은 블록 주석 참고).
# 드라이런은 워크플로별 별도 그룹. 대기열에서 기다리는 동안은 runner 시간·timeout 을 쓰지 않는다.
# 11/8: 그룹은 아래 게시 잡에만 건다(대기 잡은 그룹 밖) — 대기(sleep)가 그룹을 붙잡으면 토요일에 다른 워크플로가 몇 시간 밀린다.

permissions:
  contents: write

jobs:
  # 게시 시각까지 기다리는 잡(스케줄 실행만). 게시 그룹 밖에서 기다리므로 쇼츠·롱폼이 서로 대기열을 막지 않는다.
  wait:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      # 게시 시각을 매번 다르게, 한국 시간 저녁 창 안으로(11/3 사장님: "업로드 시간은 항상 달라야 해", 창은 17~23시 KST).
      # GitHub 스케줄은 정시 혼잡으로 3~7시간씩 늦게 시작한다(10월 실측: 19시 예약 → 22:24~02:28 KST 게시). 그래서 일찍 깨우고,
      # 그날의 목표 시각(렌더 1시간 남짓 감안해 시작 17:00~21:20 KST)을 무작위로 뽑아 그때까지 기다린다. 이미 지났으면 바로 진행. 수동 실행은 대기 없음.
      - name: 게시 시각 맞추기 (스케줄 실행만)
        run: |
          DAY0=$(date -u -d 'today 00:00' +%s)
          TARGET=$(( DAY0 + (480 + (RANDOM * 32768 + RANDOM) % (740 - 480 + 1)) * 60 ))
          NOW=$(date -u +%s)
          WAIT=$(( TARGET - NOW ))
          [ "$WAIT" -gt 13800 ] && WAIT=13800
          if [ "$WAIT" -gt 0 ]; then
            echo "목표 시작 $(TZ=Asia/Seoul date -d @$TARGET '+%H:%M') KST — $((WAIT/60))분 대기"
            sleep $WAIT
          else
            echo "목표 시각($(TZ=Asia/Seoul date -d @$TARGET '+%H:%M') KST)이 이미 지나 바로 진행"
          fi

  longform:
    needs: wait
    # 대기 잡이 성공했거나(스케줄) 건너뛰어졌을 때(수동·드라이런) 진행
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    concurrency:
      group: ${{ github.event.inputs.dry_run == 'true' && format('dryrun-{0}', github.workflow) || 'mystery-cut-publish' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 가로 영상은 렌더가 오래 걸린다(러닝타임의 3~4배 — 몰아보기 전환 전후 동일한
    # 배율). 몰아보기 5사건 드라이런 실측(2026-09-13): 사건 생성 16분 + 렌더 91분
    # = 총 107분(영상 24분 기준). Gemini 503(일시적 과부하)이 겹치는 최악의
    # 경우까지 감안해 여유를 더 뒀다 — 공개 저장소라 최대 360분까지 무료다.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium system deps
        # apt 가 미러/락 문제로 멈추는 일이 실제로 있었다(2026-08-19, 37분째
        # 진행 중이라 취소함). 스텝 상한을 두지 않으면 잡 타임아웃(180분)까지
        # 그날 게시 창을 통째로 잡아먹는다. 12분이면 정상 설치(약 40초)의
        # 열 배가 넘으므로, 넘어가면 그건 멈춘 것이다.
        timeout-minutes: 12
        run: |
          # apt 자체에도 타임아웃을 걸어 개별 명령이 무한 대기하지 않게 한다
          apt_try() { sudo timeout 150 apt-get "$@"; }
          apt_try update || { echo "⚠️  apt update 실패 — 재시도"; sleep 5; apt_try update || true; }
          # Ubuntu 24.04 에서 일부 패키지가 t64 접미사로 개명됐다(libasound2 →
          # libasound2t64 등). 러너 이미지가 바뀌어도 깨지지 않도록 두 이름을
          # 차례로 시도하고, 그래도 없으면 건너뛴다(렌더에 치명적이지 않은 것들).
          for p in libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
                   libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
                   libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 \
                   libcups2 fonts-noto-cjk ffmpeg; do
            apt_try install -y "$p" >/dev/null 2>&1 \
              || apt_try install -y "${p}t64" >/dev/null 2>&1 \
              || echo "⚠️  $p 설치 실패(무시하고 진행)"
          done
          echo "시스템 라이브러리 설치 완료"
          ffmpeg -version | head -1


      - name: Install dependencies
        run: npm ci

      # ffmpeg 가 없으면 썸네일 추출·아트디렉터 검수·나레이션 무음 트리밍이 조용히 빠진다(10/27 쇼츠: apt 에서 ffmpeg 설치
      # 실패 → 유튜브 커스텀 썸네일 없이 게시). 재설치를 한 번 더 해 보고, 그래도 없으면 Remotion 내장 ffmpeg/ffprobe 로 대체한다.
      - name: ffmpeg 확인
        run: |
          if ! command -v ffmpeg >/dev/null; then
            echo "⚠️ ffmpeg 없음 — apt 재설치 시도"
            sudo timeout 300 apt-get update >/dev/null 2>&1 || true
            sudo timeout 300 apt-get install -y ffmpeg >/dev/null 2>&1 || true
          fi
          if ! command -v ffmpeg >/dev/null; then
            echo "⚠️ apt 재설치도 실패 — Remotion 내장 ffmpeg/ffprobe 로 대체"
            for t in ffmpeg ffprobe; do
              printf '#!/bin/sh\nexec npx --no-install remotion %s "$@"\n' "$t" | sudo tee "/usr/local/bin/$t" >/dev/null
              sudo chmod +x "/usr/local/bin/$t"
            done
          fi
          ffmpeg -version 2>/dev/null | head -1

      # 무료 TTS (Microsoft Edge 뉴럴 음성) — GOOGLE_TTS_API_KEY 있으면 자동으로 Google TTS 사용
      - name: Install edge-tts
        run: pipx install edge-tts

      # 기본 BGM 은 저장소의 public/bgm/eerie.mp3 가 항상 사용됨.
      # BGM_URL 시크릿을 지정하면 그 트랙을 추가로 받아 우선 사용(선택).
      - name: Generate & publish longform
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID }}
          LF_SEED: ${{ github.event.inputs.seed }}
          LF_MODE: ${{ github.event.inputs.mode || 'auto' }}
          LF_SEED_VIDEO: ${{ github.event.inputs.seed_video_id }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run longform -- --no-publish --seed="$LF_SEED" --mode="$LF_MODE" --seed-video-id="$LF_SEED_VIDEO"
          else
            npm run longform -- --seed="$LF_SEED" --mode="$LF_MODE" --seed-video-id="$LF_SEED_VIDEO"
          fi

      # ★쇼츠 워크플로와 같은 브랜치에 푸시가 겹칠 수 있다 — 레이스 없는
      # 합성 저장 스크립트를 쓴다 (사고 경위는 post-reel.yml 의 같은 스텝 주석 참고)
      # always(): 게시 스텝이 실패해도 그 전까지 로컬에 쌓인 이력·모델 상태
      # 파일(geminiModel.txt 등)은 커밋해야 한다 — 안 그러면 다음 실행이 매번
      # 같은 시행착오(폐기된 모델 재탐색 등)를 반복한다(post-reel.yml 과
      # 정책을 맞춤, 감사에서 지적).
      - name: Save post history
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        # ★플레인 스칼라로 두면 커밋 메시지 안의 "chore: " 콜론+공백을 YAML 이
        # 새 매핑 키로 오해해 파일 전체 파싱이 깨진다(실측: post-reel.yml 의
        # 같은 스텝 주석 참고). 블록 스칼라(|)로 감싼다.
        run: |
          npx tsx scripts/commitPostHistory.mts "${{ github.ref_name }}" "chore: 롱폼 게시 이력 업데이트 [skip ci]"

      # 실패 실행(디버깅에 out/ 이 가장 필요한 순간)은 기본적으로 업로드되지
      # 않고, 매번 성공하는 정상 실행만 불필요하게 큰 산출물을 올리던 문제를
      # post-reel.yml 과 같은 정책으로 맞춘다(감사에서 지적).
      - name: Upload artifacts
        if: ${{ failure() || github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: longform-output
          path: out/
          if-no-files-found: ignore
