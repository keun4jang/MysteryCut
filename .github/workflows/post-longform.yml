name: 미스터리 롱폼 자동 게시

# 주 2회(월·목 저녁) 가로형 6~8분 사건 분석 다큐를 만들어 유튜브에 올립니다.
#
# 왜 롱폼인가: 쇼츠 조회수는 YPP 시청 시간 4,000시간에 산입되지 않는다.
# 구독자 1,000명 조건은 이미 충족했으므로, 남은 것은 시청 시간뿐이고
# 그건 롱폼으로만 쌓인다. (쇼츠 경로인 90일 1,000만 조회는 현재 속도로
# 약 41배 부족해서 현실적인 계획이 아니다.)
#
# 매일 올리지 않는 이유: 유튜브는 '템플릿으로 대량생성돼 서로 대체 가능한
# 콘텐츠'를 수익창출 부적합 사례로 든다. 심사자가 보는 최신 영상 목록이
# 매일 같은 틀의 롱폼으로 채워지면 그 자체가 위험 신호가 된다.
# 주 2개면 1년에 100편이 넘어 시청 시간 목표에도 충분하다.
on:
  schedule:
    # UTC 기준. KST = UTC+9.
    - cron: "0 9 * * 1" # 월요일 18:00 KST
    - cron: "0 9 * * 4" # 목요일 18:00 KST
  workflow_dispatch:
    inputs:
      seed:
        description: "사건 소재 힌트(선택)"
        required: false
        default: ""
      dry_run:
        description: "게시 없이 영상만 생성(검증용)"
        type: boolean
        required: false
        default: false

concurrency:
  group: post-longform-${{ github.event.inputs.dry_run == 'true' && 'dryrun' || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  longform:
    runs-on: ubuntu-latest
    # 8분짜리 가로 영상은 렌더가 오래 걸린다(실측 기준 실시간의 3~4배)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium system deps
        run: |
          sudo apt-get update
          # Ubuntu 24.04 에서 일부 패키지가 t64 접미사로 개명됐다(libasound2 →
          # libasound2t64 등). 러너 이미지가 바뀌어도 깨지지 않도록 두 이름을
          # 차례로 시도하고, 그래도 없으면 건너뛴다(렌더에 치명적이지 않은 것들).
          for p in libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
                   libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
                   libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 \
                   libcups2 fonts-noto-cjk ffmpeg; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y "${p}t64" >/dev/null 2>&1 \
              || echo "⚠️  $p 설치 실패(무시하고 진행)"
          done
          echo "시스템 라이브러리 설치 완료"
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm ci

      # 무료 TTS (Microsoft Edge 뉴럴 음성) — GOOGLE_TTS_API_KEY 있으면 자동으로 Google TTS 사용
      - name: Install edge-tts
        run: pipx install edge-tts

      # 기본 BGM 은 저장소의 public/bgm/eerie.mp3 가 항상 사용됨.
      # BGM_URL 시크릿을 지정하면 그 트랙을 추가로 받아 우선 사용(선택).
      - name: Generate & publish longform
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run longform -- --no-publish --seed="${{ github.event.inputs.seed }}"
          else
            npm run longform -- --seed="${{ github.event.inputs.seed }}"
          fi

      - name: Save post history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "mystery-cut-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json thumbnails/ data/geminiModel.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 롱폼 게시 이력 업데이트 [skip ci]"
          git push || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: longform-output
          path: out/
          if-no-files-found: ignore
