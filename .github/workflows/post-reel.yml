name: 미스터리 릴스 자동 게시

# 하루 1번(저녁 창) 실행 + 실행 시작 시 0~120분 랜덤 지연 →
# 매일 게시 시각이 달라져서 자동화 티가 덜 납니다. (모두 무료)
#
# 2026-08: 하루 3개 → 1개로 축소했습니다. 이유 두 가지입니다.
#  ① 쇼츠로는 YPP 에 못 갑니다. 최근 14일 실측(영상당 평균 908회)으로 90일
#     1,000만 조회 기준까지 약 41배 부족하고, 편수를 2배로 늘려도 20배가
#     부족합니다. 물량으로 넘을 수 있는 격차가 아닙니다.
#  ② 유튜브는 '템플릿으로 대량생성돼 서로 대체 가능한 콘텐츠'를 수익창출
#     부적합 사례로 명시합니다. 매일 같은 틀의 영상 3개는 그 신호를 키웁니다.
# 쇼츠의 역할을 'YPP 달성 수단'에서 '소재 테스트 + 롱폼 예고편'으로 바꿉니다.
# 구독자 알림도 채널당 하루 3개가 상한이라, 남은 자리를 롱폼에 양보합니다.
on:
  schedule:
    # UTC 기준. KST = UTC+9. 주 4개(화·목·토·일), 게시 시각은 매번 17~23시 KST 사이 무작위. 롱폼(월·수·금)과 요일을 나눈다.
    # 2026-10-02 매일 → 주 4개: 커뮤니티 가이드 스팸 조항 'Automated or synthetic
    # mass-production'(경고·해지까지 가는 조항)에 걸릴 노출면을 줄인다. 쇼츠 시청은
    # YPP 시청시간에 안 들어가고, 쇼츠→롱폼 유입도 90일 9회뿐이라 잃는 게 거의 없다.
    # 목·일요일 회차는 '감동 실화(선과 악)' 편(10/3 일요일 시작, 10/11 목요일 추가 — src/lib/variety.ts WARM_WEEKDAYS).
    - cron: "23 3 * * 0,2,4,6" # 12:23 KST 에 깨워 17~23시 KST 사이 무작위 시각에 게시(아래 '게시 시각 맞추기')
  workflow_dispatch: # 수동 실행(테스트용) — 랜덤 지연 없이 바로 실행
    inputs:
      seed:
        description: "스토리 소재 힌트(선택)"
        required: false
        default: ""
      angle:
        description: "소재 각도 강제 지정(선택). 예: 그 시절, 기묘한 인물, 기이한 장소, 감동 실화"
        required: false
        default: ""
      dry_run:
        description: "게시 없이 영상만 생성(검증용)"
        type: boolean
        required: false
        default: false
      skip_youtube:
        description: "유튜브 업로드 생략(인스타만 테스트)"
        type: boolean
        required: false
        default: false

# 실제 게시끼리는 직렬(중복 게시 방지)이되, 드라이런(검증용 렌더)은 별도 그룹으로
# 분리해 정기 게시의 랜덤 지연 뒤에서 몇 시간씩 대기하지 않게 한다.
# ★'publish' 그룹은 post-longform.yml 과 이름을 공유한다 — 롱폼(월·수·금
# 09:00 UTC)과 쇼츠(매일 10:00 UTC + 0~90분 랜덤)가 겹치는 날, 두 워크플로가
# 서로 다른 체크아웃 시점의 history.json 으로 각자 소재를 골라 같은 사건이
# 같은 날 두 번 게시될 수 있었다(감사에서 발견). 같은 그룹을 쓰면 뒤에 시작한
# 쪽이 대기열에서 기다렸다가 앞선 실행의 이력 커밋이 끝난 뒤 시작해 레이스가
# 원천적으로 사라진다(대기는 runner 시간을 소모하지 않아 180분 타임아웃과
# 무관하다).
concurrency:
  group: post-reel-${{ github.event.inputs.dry_run == 'true' && 'dryrun' || 'mystery-cut-publish' }}
  cancel-in-progress: false

# 인스타 업로드용 임시 공개 호스팅(릴리스 생성/삭제)에 필요
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # 랜덤 지연(최대 120분) + 생성·렌더·게시 여유까지 포함해 넉넉히
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Remotion 헤드리스 렌더에 필요한 시스템 라이브러리 + ffmpeg(나레이션 무음 트리밍용)
      - name: Install Chromium system deps
        # apt 가 미러/락 문제로 멈추는 일이 실제로 있었다(2026-08-19, 37분째
        # 진행 중이라 취소함). 스텝 상한을 두지 않으면 잡 타임아웃(180분)까지
        # 그날 게시 창을 통째로 잡아먹는다. 12분이면 정상 설치(약 40초)의
        # 열 배가 넘으므로, 넘어가면 그건 멈춘 것이다.
        timeout-minutes: 12
        run: |
          # apt 자체에도 타임아웃을 걸어 개별 명령이 무한 대기하지 않게 한다
          apt_try() { sudo timeout 150 apt-get "$@"; }
          apt_try update || { echo "⚠️  apt update 실패 — 재시도"; sleep 5; apt_try update || true; }
          # Ubuntu 24.04 에서 일부 패키지가 t64 접미사로 개명됐다(libasound2 →
          # libasound2t64 등). 러너 이미지가 바뀌어도 깨지지 않도록 두 이름을
          # 차례로 시도하고, 그래도 없으면 건너뛴다(렌더에 치명적이지 않은 것들).
          for p in libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
                   libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
                   libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 \
                   libcups2 fonts-noto-cjk ffmpeg; do
            apt_try install -y "$p" >/dev/null 2>&1 \
              || apt_try install -y "${p}t64" >/dev/null 2>&1 \
              || echo "⚠️  $p 설치 실패(무시하고 진행)"
          done
          echo "시스템 라이브러리 설치 완료"
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm ci

      # ffmpeg 가 없으면 썸네일 추출·아트디렉터 검수·나레이션 무음 트리밍이 조용히 빠진다(10/27 쇼츠: apt 에서 ffmpeg 설치
      # 실패 → 유튜브 커스텀 썸네일 없이 게시). 재설치를 한 번 더 해 보고, 그래도 없으면 Remotion 내장 ffmpeg/ffprobe 로 대체한다.
      - name: ffmpeg 확인
        run: |
          if ! command -v ffmpeg >/dev/null; then
            echo "⚠️ ffmpeg 없음 — apt 재설치 시도"
            sudo timeout 300 apt-get update >/dev/null 2>&1 || true
            sudo timeout 300 apt-get install -y ffmpeg >/dev/null 2>&1 || true
          fi
          if ! command -v ffmpeg >/dev/null; then
            echo "⚠️ apt 재설치도 실패 — Remotion 내장 ffmpeg/ffprobe 로 대체"
            for t in ffmpeg ffprobe; do
              printf '#!/bin/sh\nexec npx --no-install remotion %s "$@"\n' "$t" | sudo tee "/usr/local/bin/$t" >/dev/null
              sudo chmod +x "/usr/local/bin/$t"
            done
          fi
          ffmpeg -version 2>/dev/null | head -1

      # 무료 TTS (Microsoft Edge 뉴럴 음성) — GOOGLE_TTS_API_KEY 있으면 자동으로 Google TTS 사용
      - name: Install edge-tts
        run: pipx install edge-tts

      # 기본 BGM 은 저장소의 public/bgm/eerie.mp3 가 항상 사용됨.
      # BGM_URL 시크릿을 지정하면 그 트랙을 추가로 받아 우선 사용(선택).
      - name: Fetch BGM (optional override)
        env:
          BGM_URL: ${{ secrets.BGM_URL }}
        run: |
          if [ -n "$BGM_URL" ]; then
            mkdir -p public/bgm
            curl -sSL --max-time 60 -o public/bgm/aaa-override.mp3 "$BGM_URL" \
              && echo "BGM 오버라이드 다운로드 완료" || echo "BGM 오버라이드 실패(기본 eerie.mp3 사용)"
          else
            echo "BGM_URL 미설정 — 저장소 기본 BGM(eerie.mp3) 사용"
          fi

      # 게시 시각을 매번 다르게, 한국 시간 저녁 창 안으로(11/3 사장님: "업로드 시간은 항상 달라야 해", 창은 17~23시 KST).
      # GitHub 스케줄은 정시 혼잡으로 3~7시간씩 늦게 시작한다(10월 실측: 19시 예약 → 22:24~02:28 KST 게시). 그래서 일찍 깨우고,
      # 그날의 목표 시각(시작 17:00~22:45 KST)을 무작위로 뽑아 그때까지 기다린다. 이미 지났으면 바로 진행. 수동 실행은 대기 없음.
      - name: 게시 시각 맞추기 (스케줄 실행만)
        if: github.event_name == 'schedule'
        run: |
          DAY0=$(date -u -d 'today 00:00' +%s)
          TARGET=$(( DAY0 + (480 + (RANDOM * 32768 + RANDOM) % (825 - 480 + 1)) * 60 ))
          NOW=$(date -u +%s)
          WAIT=$(( TARGET - NOW ))
          [ "$WAIT" -gt 18000 ] && WAIT=18000
          if [ "$WAIT" -gt 0 ]; then
            echo "목표 시작 $(TZ=Asia/Seoul date -d @$TARGET '+%H:%M') KST — $((WAIT/60))분 대기"
            sleep $WAIT
          else
            echo "목표 시각($(TZ=Asia/Seoul date -d @$TARGET '+%H:%M') KST)이 이미 지나 바로 진행"
          fi

      - name: Generate & publish reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IG_API_MODE: ${{ vars.IG_API_MODE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          # 배경 자료화면 (Pexels 무료 스톡)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 나레이션: GOOGLE_TTS_API_KEY 있으면 자연스러운 Google TTS, 없으면 edge-tts
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          # 유튜브 업로드 (세 값이 모두 있으면 자동으로 유튜브에도 게시)
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID }}
          # 인스타 업로드용 임시 공개 호스팅(GitHub 릴리스)에 사용
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 유튜브 생략 옵션(인스타만 테스트할 때)
          SKIP_YOUTUBE: ${{ github.event.inputs.skip_youtube }}
          # 소재 각도 강제 지정(검증용). 비어 있으면 평소대로 랜덤 로테이션
          FORCE_ANGLE: ${{ github.event.inputs.angle }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🧪 드라이런: 게시 없이 영상만 생성합니다."
            npm run pipeline -- --no-publish --seed="${{ github.event.inputs.seed }}"
          else
            npm run pipeline -- --seed="${{ github.event.inputs.seed }}"
          fi

      # 게시 이력(data/history.json)·썸네일 보관본(thumbnails/)·인스타 API 버전
      # (data/igGraphVersion.txt)·Gemini 모델(data/geminiModel.txt) — 뒤 둘은
      # 메타/구글이 기존 버전·모델을 바꿔 자동으로 다음 것을 찾았을 때만 생성됨
      # — 이 갱신됐으면 저장소에 커밋.
      # dry_run 은 게시 안 하므로 이력·썸네일은 안 바뀜(모델 파일은 dry_run 에서도
      # 갱신될 수 있지만 커밋은 실게시 때만) → always() 지만 변경 없으면 스킵됨
      # ★pull --rebase 방식은 쓰지 않는다 — 2026-08-24 실측: 롱폼 워크플로와
      # 몇 초 간격으로 푸시가 겹치자 history.json 리베이스 충돌로 이력 커밋이
      # 조용히 유실됐다(중복 회피가 그 사건을 모르게 됨). commitPostHistory 는
      # 원격 최신 위에 이력을 데이터 수준으로 합성해 레이스가 원천적으로 없다.
      - name: Save post history
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        # ★플레인 스칼라(따옴표 없는 한 줄)로 두면 커밋 메시지 안의 "chore: " 처럼
        # 콜론+공백이 있는 문자열에서 YAML 이 그걸 새 매핑 키로 오해해 파일 전체가
        # 파싱 실패한다("mapping values are not allowed here") — 실측: 이 문장을
        # 넣은 두 커밋 모두 push 직후 워크플로가 즉시 실패로 떴다(로그 없이,
        # 0개 잡). 블록 스칼라(|)는 콜론이 있어도 그대로 리터럴로 읽는다.
        run: |
          npx tsx scripts/commitPostHistory.mts "${{ github.ref_name }}" "chore: 게시 이력·썸네일·API 버전 정보 업데이트 [skip ci]"

      # 드라이런이거나 실패 시 산출물(영상/JSON) 업로드해서 확인
      - name: Upload artifacts
        if: ${{ failure() || github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-output
          path: |
            out/
          if-no-files-found: ignore
