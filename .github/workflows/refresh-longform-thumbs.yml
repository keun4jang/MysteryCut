name: "🖼️ 롱폼 썸네일 4편 교체"

# 사용법:
#  1) apply 를 끄고 실행 → 결과 페이지의 longform-thumbs-preview 이미지를 확인(유튜브 변경 없음)
#  2) apply 를 켜고 preview_run_id 에 1)의 실행 번호(주소 /actions/runs/ 뒤 숫자)를 넣어 실행
# 대상 4편은 scripts/thumbRefreshPlan.mts 에 고정. 제목·설명은 바꾸지 않습니다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "켜면 미리보기 이미지를 유튜브에 실제 적용"
        type: boolean
        default: false
      preview_run_id:
        description: "적용할 미리보기 실행 번호(apply 일 때 필수)"
        required: false
        default: ""
      only:
        description: "한 편만 할 때 영상 ID(비우면 4편 전부)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh-longform-thumbs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Chromium system deps
        if: ${{ !inputs.apply }}
        timeout-minutes: 12
        run: |
          apt_try() { sudo timeout 150 apt-get "$@"; }
          apt_try update || { sleep 5; apt_try update || true; }
          for p in libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
                   libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
                   libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 \
                   libcups2 fonts-noto-cjk; do
            apt_try install -y "$p" >/dev/null 2>&1 \
              || apt_try install -y "${p}t64" >/dev/null 2>&1 \
              || echo "⚠️  $p 설치 실패(무시하고 진행)"
          done

      - name: 미리보기 이미지 만들기
        if: ${{ !inputs.apply }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: npx tsx scripts/refreshLongformThumbs.mts ${ONLY:+--only="$ONLY"}

      - name: 미리보기 저장
        if: ${{ !inputs.apply }}
        uses: actions/upload-artifact@v4
        with:
          name: longform-thumbs-preview
          path: out/thumb-refresh/
          if-no-files-found: error

      - name: 미리보기 실행 번호 확인
        if: ${{ inputs.apply }}
        env:
          RUN_ID: ${{ inputs.preview_run_id }}
        run: |
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "preview_run_id 에 미리보기 실행 번호(숫자)를 넣어 주세요."; exit 1 ;;
          esac

      - name: 미리보기 이미지 받기
        if: ${{ inputs.apply }}
        uses: actions/download-artifact@v4
        with:
          name: longform-thumbs-preview
          path: out/thumb-refresh/
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}

      - name: 유튜브에 적용
        if: ${{ inputs.apply }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: npx tsx scripts/refreshLongformThumbs.mts --apply ${ONLY:+--only="$ONLY"}

      - name: 교체 전 썸네일 백업 저장
        if: ${{ always() && inputs.apply }}
        uses: actions/upload-artifact@v4
        with:
          name: longform-thumbs-backup
          path: out/thumb-refresh/backup/
          if-no-files-found: ignore
